[custom]
;不要随意改变关键字，否则会导致出错
;设置规则标志位
ruleset=AI,https://yfamilys.com/rule/ai.list
ruleset=直连,[]GEOSITE,CN
ruleset=直连,[]GEOIP,CN
ruleset=兜底,[]FINAL
;设置规则标志位

;设置分组标志位
custom_proxy_group=节点选择`select`[]DIRECT`.*
custom_proxy_group=AI`select`[]节点选择`[]DIRECT`
custom_proxy_group=直连`select`[]DIRECT`[]节点选择`
custom_proxy_group=兜底`select`[]节点选择`[]DIRECT`
;设置分组标志位
enable_rule_generator=true
overwrite_original_rules=true
